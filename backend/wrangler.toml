name = "racks4l-beats-api"
main = "src/index.js"
compatibility_date = "2026-10-15"
workers_dev = true

[vars]
APP_ORIGIN = "http://localhost:8787"
SESSION_COOKIE_NAME = "r4l_session"
SESSION_TTL_SECONDS = "604800"
SUPABASE_PREVIEWS_BUCKET = "previews"
SUPABASE_COVERS_BUCKET = "covers"
SUPABASE_PRIVATE_AUDIO_BUCKET = "private-audio"
SUPABASE_STEMS_BUCKET = "stems"

[[d1_databases]]
binding = "DB"
database_name = "racks4l-beats-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "../migrations"
