<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Racks4L Beats</title><meta name="theme-color" content="#000">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><a class="logo" href="#" aria-label="Racks4L Beats"><img src="/logo.png" alt="Racks4L" width="600" height="177"><span>BEATS</span></a>
<nav><a href="#about">Продюсер</a><a href="#licenses">Лицензии</a><a href="#catalog">Каталог</a></nav>
<div class="acts"><button class="ghost" id="adm" hidden onclick="openAdmin()">Админ</button><button class="ghost" onclick="myOrders()">Мои заказы</button><button class="ghost" id="acc" onclick="account()">Войти</button><button class="cartbtn" onclick="cartView()">Корзина <i id="cc">0</i></button></div></header>
<main><section id="about"></section><section id="licenses"></section>
<section id="catalog"><h2>Каталог</h2>
<div class="bar"><input id="q" type="search" placeholder="Поиск: название, ключ, BPM (140 или 130-150)" autocomplete="off" aria-label="Поиск"><select id="so" aria-label="Сортировка"><option value="new">Сначала новые</option><option value="old">Сначала старые</option><option value="bpmA">BPM ↑</option><option value="bpmD">BPM ↓</option><option value="prA">Цена ↑</option><option value="prD">Цена ↓</option><option value="az">Название А–Я</option></select></div>
<div id="gf" class="gf"></div><p id="cnt" class="muted cnt"></p><div id="grid" class="list"></div></section></main>
<footer>© Racks4L Beats</footer>
<div id="pl" class="player" hidden><div class="pinfo"><div><b id="pt">—</b><small id="pm"></small></div></div>
<div class="pctl"><button onclick="step(-1)" aria-label="prev">⏮</button><button id="pp" class="pbtn" onclick="toggle()">▶</button><button onclick="step(1)" aria-label="next">⏭</button></div>
<div class="pseek"><span id="tc">0:00</span><input id="sk" type="range" min="0" max="1000" value="0"><span id="td">0:00</span></div>
<input id="vol" type="range" min="0" max="100" value="80" aria-label="volume"></div>
<div id="ov" class="ov" hidden onclick="if(event.target===this)closeOv()"><div id="box" class="box"></div></div>
<div id="adminv" class="adminv" hidden></div><div id="toast"></div>
<script src="/app.js"></script></body></html>
