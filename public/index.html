<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Racks4L Beats</title><meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><a class="logo" href="#" aria-label="Racks4L Beats"><img src="/logo.png" alt="Racks4L" width="900" height="197"></a>
<nav><a href="#about">Продюсер</a><a href="#licenses">Лицензии</a><a href="#catalog">Каталог</a></nav>
<div class="acts"><button class="ghost" id="adm" hidden onclick="openAdmin()" aria-label="Админ"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg><span>Админ</span></button><button class="ghost" onclick="myOrders()" aria-label="Мои заказы"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Мои заказы</span></button><button class="ghost" id="acc" onclick="account()" aria-label="Аккаунт"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Войти</span></button><button class="cartbtn" onclick="cartView()" aria-label="Корзина"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.5l2.2 11h10.6L20.5 8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg><span>Корзина</span> <i id="cc">0</i></button></div></header>
<main><section id="about"></section><section id="licenses"></section>
<section id="catalog"><h2>Каталог</h2>
<div class="bar"><input id="q" type="search" placeholder="Поиск" autocomplete="off" aria-label="Поиск"><select id="so" aria-label="Сортировка"><option value="new">Сначала новые</option><option value="old">Сначала старые</option><option value="bpmA">BPM ↑</option><option value="bpmD">BPM ↓</option><option value="prA">Цена ↑</option><option value="prD">Цена ↓</option><option value="az">Название А–Я</option></select></div>
<div id="gf" class="gf"></div><p id="cnt" class="muted cnt"></p><div id="grid" class="list"></div></section></main>
<footer>© Racks4L Beats</footer>
<div id="pl" class="player" hidden><div class="pinfo"><div><b id="pt">—</b><small id="pm"></small></div></div>
<div class="pctl"><button onclick="step(-1)" aria-label="prev"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button><button id="pp" class="pbtn" onclick="toggle()">▶︎</button><button onclick="step(1)" aria-label="next"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg></button></div>
<div class="pseek"><span id="tc">0:00</span><input id="sk" type="range" min="0" max="1000" value="0"><span id="td">0:00</span></div>
<input id="vol" type="range" min="0" max="100" value="80" aria-label="volume"></div>
<div id="ov" class="ov" hidden onclick="if(event.target===this)closeOv()"><div id="box" class="box"></div></div>
<div id="adminv" class="adminv" hidden></div><div id="toast"></div>
<script src="/app.js"></script></body></html>
